# SpineBox の設定例。config.local.toml(git 管理外)にコピーして使う。
# 別の場所に置くときは環境変数 SPINEBOX_CONFIG にそのパスを入れる。
# 相対パスはこの設定ファイルのあるフォルダを起点に解決する。
# 蔵書のパスはサーバー機のものを書く(開発機のドライブ文字・ユーザー名を前提にしない)。

# 蔵書フォルダ(複数可)の取り込み元。蔵書フォルダの正は DB で、画面の管理「蔵書」タブで足す・外す・まとめる(#313)。
# ここに書いたパスは、DB にまだ無いものだけ足される(消しても外れない。外すのは画面から)。
# 見えないとき(外付けドライブ未接続など)はオフライン扱いになり、記録は消えない。
library_roots = [
    # "E:/Books/Comics",
    # "F:/Scans",
]

# DB と展開キャッシュの置き場
data_dir = "./data"

# 展開キャッシュの上限(バイト)。超えたら最後に使ったのが古いものから消える。既定 2 GiB
cache_limit_bytes = 2147483648

# RAM 層の上限(バイト)。7z / rar のページ(先の数ページをまとめて取り出した分)と目次を置き、超えたら
# 最後に使ったのが古いものから消える。0 にすると使わない。既定 256 MiB。
# サーバー機(DESKTOP-80AKMUB)では 8 GiB(8589934592)まで上げてよい。大きいほどソリッド 7z の巻を
# 行き来したときに取り出し直さずに済む(合計がこの値を超えることはない。ただし Python 自体の使用量は別)
memory_cache_limit_bytes = 268435456

# 作品カードの表紙(1 ページ目の縮小。data_dir/thumbs/)の上限(バイト)。1 枚 20〜40 KB ほど。既定 256 MiB
thumb_cache_limit_bytes = 268435456

# 待ち受け。LAN の別端末から使うときだけサーバー機の LAN 側アドレス(または 0.0.0.0)にする。
# インターネットへ直接公開しない(認証が無い。ルーターのポート開放もしない)。
# LAN に公開するときは Windows ファイアウォールの規則も要る(deploy/firewall_rule.ps1、wiki/operations/server-setup.md)。
host = "127.0.0.1"
port = 8000

# 7-Zip CLI のパス(7z / rar の読み取りに使う)。サーバー機の 7z.exe のパスを書く。名前だけなら PATH から探す。
# 見つからないとき 7z / rar は「未対応」として一覧から外れる(zip / cbz は読める)
# sevenzip_path = "C:/Program Files/7-Zip/7z.exe"
sevenzip_path = "7z"

# 整理処理(CBZ 化)の作業場(work/)と退避フォルダ(trash/)の置き場。
# 相対パスは各蔵書ルートが起点(この設定ファイルの場所ではない)。スキャンはここを蔵書として扱わない。
# 作業場から改名で確定するため、蔵書と同じドライブに置く(別ドライブになる構成は実行前に拒否される)
organize_dir = ".spinebox"

# 受け入れフォルダ(#66)。新しく手に入れた本を置く場所で、蔵書には数えない。画面の「受け入れ」で同期すると検出され、
# プレビューを見て承認したものだけが書庫(library)へ入る(元は受け入れフォルダの .spinebox/trash へ移すだけで消さない)。
# 受け入れフォルダは書庫と重ならない・書庫と同じドライブに置く(別ドライブは受け入れない)。
# library は蔵書フォルダのどれか(画面から足したものでもよい。DB と突き合わせる)。ここの library_roots が 1 つだけなら省略できる(文字列だけでも書ける: inbox_dirs = ["E:/Inbox"])
inbox_dirs = [
    # { path = "E:/Inbox", library = "E:/Books/Comics" },
]

# 内側アーカイブ(アーカイブの中のアーカイブ)の巻を裏で 1 巻ずつ開いて中の巻に分解する。既定は無効
# (無効でも、その巻を開いたとき・一覧の「中の巻を調べる」で分解する)。有効にすると展開キャッシュを使う
background_analysis = false
# 裏の解析の間隔(秒)。1 回に 1 巻だけ解析する
background_analysis_interval = 60

# 展開の上限。超えたアーカイブ・エントリは理由を記録してスキップする
[limits]
# 1 アーカイブの展開後サイズの合計(目次の宣言値)
max_total_bytes = 68719476736   # 64 GiB
# 1 エントリの展開サイズ(ページ画像の読み出し・内側アーカイブの取り出し)
max_entry_bytes = 2147483648    # 2 GiB
# 1 アーカイブのエントリ数
max_entries = 100000
# アーカイブの入れ子の深さ(1 = 外側の中の内側アーカイブまで開く)。蔵書に 7z の中の rar の中の rar の中の zip がある
max_depth = 3

# 整理処理の命名テンプレート(蔵書ルートからの相対パス。`/` でフォルダを区切り、.cbz で終える)。
# 変数: <作品名> <著者> <出版社> <番号>(<番号:3> で 3 桁)<単位>(巻 / 話)。NN は <番号:2> の略記。
# 番号の直後の「巻」は話単位の巻では「話」になる。値が無い巻(作品に未割り当て・番号が読めない等)は対象外として理由を出す
[organize]
name_template = "<作品名>/<作品名> 第NN巻.cbz"

# 外部メタデータ(国立国会図書館サーチ・メディア芸術データベース・Bangumi)の取得。ベストエフォート:
# 失敗・タイムアウト・レート制限があってもスキャンと閲覧は止まらない。生の応答は DB に保存して使い回す。
[metadata]
# 有効にする取得元。空 [] にすると外部へ一切取りに行かない。
# 同人誌を扱うなら "nhentai" と "ehentai" を足す(既定では無効。成人向けのサイトへ作品名を送るので、明示的に有効にする)。
# 題名の書式 `(C70) [サークル (作者)] 題名 (原作)` で照合する(wiki/concepts/metadata-sources.md)
# 全作品をまとめて取る処理(データ管理)は ndl → mediaarts → bangumi → ehentai → nhentai の順に引き、
# 確かな連携(確信度 0.9 以上)が決まったら残りを引かない。作品ページの「情報を取得」は全取得元を引く。
# ndl は応答が遅い(1 要求 約 6 秒)。まとめての取得が遅ければここから外す
sources = ["ndl", "mediaarts", "bangumi"]
# 保存済みの応答を使い回す日数。過ぎると取り直す(取得に失敗したときは古い応答を代わりに使う)
cache_ttl_days = 30
timeout_seconds = 10
# 5xx・タイムアウト・接続不可の再試行の上限(429 は再試行しない)
max_retries = 2
# 1 回の検索で取る候補の上限 / Bangumi・nHentai で詳細を引き直す候補の数
candidate_limit = 20
detail_limit = 3
# User-Agent に付ける連絡先(任意。取得元の運営者が連絡できるように)。メールアドレスなどを書くなら、
# このファイルをコミットしないこと
# contact = ""
# 作品ページの「情報を取得」・一覧の「情報を補完」は常に使える。これを true にすると、サーバーが裏で
# 1 作品ずつ(下の間隔ごとに)公開 DB の情報を取りに行く。既定は無効。スキャン・閲覧は取得を待たない
background = false
background_interval_seconds = 120
# 取得済みの作品を取り直す間隔(日)/ 取得に失敗した作品を取り直すまでの間隔(時間)
recheck_days = 30
retry_hours = 6
# 日本語での表示。ehentai / nhentai の英語のジャンル・タグは対応表で日本語にして入れる(機械翻訳はしない)。
# Bangumi のタグは簡体字中国語で対応表に無く、この設定は効かない(既定で非表示)。
# 対応表に無い語を hide(入れない)か keep(そのまま入れる)か。取得した元の値は消えないので、いつでも切り替えられる
untranslated_terms = "hide"

# 取得元ごとの最小間隔(秒)。直前の要求が終わってから空ける。既定は各取得元の公開されている制限から決めた値
# (wiki/concepts/metadata-sources.md)。メディア芸術データベース・Bangumi は公式の制限値が見当たらず未検証
[metadata.min_interval_seconds]
ndl = 1.0
mediaarts = 1.0
bangumi = 1.0
# 同人誌用。nHentai の匿名の制限は検索 10 回/分(= 6 秒に 1 回)・詳細 20 回/分。API キーがあれば 20 回/分・45 回/分なので 3.0 まで下げられる。
# E-Hentai は公式に「4〜5 回連続したら 5 秒ほど待つ」程度の記述しかなく、守らないと IP が一時的に遮断される
nhentai = 6.5
ehentai = 4.0

# 取得元の API キー。今の取得元はどれもキー不要(nHentai のキーは任意。あれば制限が緩む)。
# キーはこの設定ファイル(リポジトリ外)にだけ書く。ログ・保存した応答・Issue には出さない
[metadata.keys]
# nhentai_api_key = ""      # https://nhentai.net/user/settings#apikeys で発行。`Authorization: Key …` で送る
# rakuten_application_id = ""

# フォロー(#87)。フォローした作品の続刊(持っていない新しい巻)と欠けた巻を、国立国会図書館サーチの巻ごとの書誌で調べて知らせる
# (知らせるだけで、本の入手はしない)。「フォロー管理」の「続刊を調べる」は常に使える。
[follow]
# true にすると、サーバーが裏で 1 作品ずつ(見回りの間隔ごとに)、interval_hours 以上調べていない作品を調べる。既定は無効
background = false
interval_hours = 24
background_interval_seconds = 300
# 続刊の確認で保存済みの応答を使い回す期間(日)。[metadata] cache_ttl_days より短くして新刊を拾う
response_ttl_days = 1
