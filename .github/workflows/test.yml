name: tests

# CI。push/PR のたびにテストを自動実行する。
#
# 検査の中身は scripts/ci_local.py の jobs() が正で、ここはそれを呼ぶだけ。
# Actions が課金・上限で起動しないときは、同じスクリプトを手元で実行して
# commit status (local/test) を載せる。ジョブ名 `test` は local/test と対応しているので変えない。

# push は main だけ。ブランチは pull_request で検査する (両方で起動すると PR ブランチで同じ検査が
# 2 回走り、Actions の使用量が倍になる。#369)。PR を作る前のブランチは CI が走らないので、
# 手元で確かめるときは python scripts/ci_local.py --no-report を使う。
on:
  push:
    branches:
      - main
  pull_request:

# 同じ ref (PR なら refs/pull/<番号>/merge) で新しく push されたら、古い head の実行は取り消す。
# レビュー (gh pr checks) が見るのは最新 head のチェックだけなので、取り消された実行は判定に残らない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: python scripts/ci_local.py --job test --no-report
